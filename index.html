<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments Representative Job Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 2rem;
        }
        .container {
            max-width: 560px; width: 100%;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 1.25rem;
            padding: 2.5rem;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.5);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .icon {
            width: 60px; height: 60px; border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem; font-size: 1.75rem;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }
        h1 { color: #f1f5f9; font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; line-height: 1.6; }
        .form-group { margin-bottom: 1.1rem; }
        label {
            display: block; color: #cbd5e1; font-size: 0.75rem;
            font-weight: 600; margin-bottom: 0.4rem;
            text-transform: uppercase; letter-spacing: 0.06em;
        }
        label .req { color: #f87171; }
        input, select, textarea {
            width: 100%; padding: 0.75rem 1rem; border-radius: 0.6rem;
            border: 1px solid rgba(148, 163, 184, 0.2);
            font-size: 0.9rem; font-family: inherit;
            background: rgba(15, 23, 42, 0.6); color: #e2e8f0;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        input::placeholder, textarea::placeholder { color: #475569; }
        select option { background: #1e293b; color: #e2e8f0; }
        textarea { resize: vertical; min-height: 90px; }
        .btn {
            width: 100%; padding: 0.85rem; border: none; border-radius: 0.6rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            color: #fff; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; margin-top: 0.5rem;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            transition: opacity 0.2s, transform 0.1s;
            letter-spacing: 0.02em;
        }
        .btn:hover { opacity: 0.92; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .success {
            padding: 1.25rem; border-radius: 0.75rem; margin-bottom: 1.5rem;
            background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80; font-size: 0.9rem; text-align: center; line-height: 1.5;
        }
        .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.7rem; }
        .row { display: flex; gap: 1rem; }
        .row .form-group { flex: 1; }
        @media (max-width: 480px) {
            .container { padding: 1.5rem; }
            .row { flex-direction: column; gap: 0; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">🚀</div>
            <h1>Payments Representative</h1>
            <p class="subtitle">We are hiring remote Payments Representatives. Fill out the form below to apply. We review every application.</p>
        </div>

        <div id="result"></div>

        <form id="applyForm">

            <div class="row">
                <div class="form-group">
                    <label>Full Name <span class="req">*</span></label>
                    <input type="text" name="Full Name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address <span class="req">*</span></label>
                    <input type="email" name="Email Address" placeholder="john@example.com" required>
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Phone Number <span class="req">*</span></label>
                    <input type="tel" name="Phone Number" placeholder="+1 (555) 123-4567" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" name="Address" placeholder="City, Country">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Years of Experience <span class="req">*</span></label>
                    <select name="Years of Experience" required>
                        <option value="">Select...</option>
                        <option>0-2 years</option>
                        <option>3-5 years</option>
                        <option>5-10 years</option>
                        <option>10+ years</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Availability <span class="req">*</span></label>
                    <select name="Availability" required>
                        <option value="">Select...</option>
                        <option>Immediately</option>
                        <option>1 week</option>
                        <option>2 weeks</option>
                        <option>1 month</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Portfolio / LinkedIn URL</label>
                <input type="url" name="Portfolio URL" placeholder="https://linkedin.com/in/yourprofile">
            </div>
            <div class="form-group">
                <label>Tell Us About Yourself</label>
                <textarea name="Message" placeholder="Share your experience, skills, and why you'd be a great fit..."></textarea>
            </div>
            <button type="submit" class="btn" id="submitBtn">🚀 Submit Application</button>
        </form>

        <div class="footer">Synlab Group</div>
    </div>
    <script>
        const API_URL = 'https://bulk-emailer-production.up.railway.app';
        const SLUG = 'remote-jobs';
        const form = document.getElementById('applyForm');
        const result = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            result.innerHTML = '';

            const data = {};
            const fd = new FormData(form);
            fd.forEach((v, k) => { if (!k.startsWith('_')) data[k] = v; });

            try {
                const res = await fetch(API_URL + '/api/landing-pages/public/' + SLUG, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: data['Full Name'] || '',
                        email: data['Email Address'] || '',
                        phone: data['Phone Number'] || '',
                        address: data['Address'] || '',
                        experience: data['Years of Experience'] || '',
                        availability: data['Availability'] || '',
                        portfolio: data['Portfolio URL'] || '',
                        message: data['Message'] || '',
                    }),
                });
                const json = await res.json();
                if (res.ok) {
                    result.innerHTML = '<div class="success">✅ Application submitted successfully! We will review your application and get back to you soon.</div>';
                    form.reset();
                } else {
                    result.innerHTML = '<div style="padding:1rem;border-radius:0.5rem;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;text-align:center;font-size:0.9rem;">❌ ' + (json.error || 'Submission failed. Please try again.') + '</div>';
                }
            } catch (err) {
                result.innerHTML = '<div style="padding:1rem;border-radius:0.5rem;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;text-align:center;font-size:0.9rem;">❌ Network error. Please check your connection and try again.</div>';
            }
            submitBtn.disabled = false;
            submitBtn.textContent = '\u{1F680} Submit Application';
        });
    </script>
</body>
</html>
